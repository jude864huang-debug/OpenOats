name: package-smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-smoke:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install and test Codex worker
        run: |
          npm --prefix worker ci --omit=dev
          npm --prefix worker test

      - name: Select Xcode 26
        run: bash "${{ github.workspace }}/scripts/select_xcode_26.sh"

      - name: Build and verify distributable app bundle
        run: bash ./scripts/package_smoke_check.sh
